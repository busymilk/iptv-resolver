version: '3.8'

services:
  iptv-resolver:
    build: .
    container_name: iptv-resolver
    restart: unless-stopped
    ports:
      - "8080:8080" # 将容器内的 8080 局域网端口暴露给电视等局域网设备
    volumes:
      - ./config.json:/app/config.json
      - ./output:/app/output
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
